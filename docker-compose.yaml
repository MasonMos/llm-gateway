services:
  gateway:
    build: .                 # build from your Dockerfile
    ports: ["8000:8000"]     # laptop:container
    environment:
      DATABASE_URL: postgresql://gw:gw@postgres:5432/gateway
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gw
      POSTGRES_PASSWORD: gw
      POSTGRES_DB: gateway
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7

volumes:
  pgdata: